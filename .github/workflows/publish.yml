name: Publish paper

# Publication is keyless and separate from paid compilation. A manual run
# promotes the newest successful academic candidate from current main.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: censorship-publication
  cancel-in-progress: false

jobs:
  assemble:
    if: ${{ github.actor == github.repository_owner && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.candidate.outputs.source_sha }}
    permissions:
      contents: read
      actions: read
    env:
      TARGET_ID: journal_academic
    steps:
      - name: Check out trusted publication infrastructure
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: infra
          persist-credentials: false

      - name: Resolve latest successful retained candidate
        id: retained
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            );
            const prefix = `censorship-candidate-${process.env.TARGET_ID}-`;
            let newest = null;
            for (const artifact of artifacts) {
              if (
                artifact.expired ||
                !artifact.name.startsWith(prefix) ||
                !artifact.workflow_run?.id
              ) {
                continue;
              }
              const { data: run } = await github.rest.actions.getWorkflowRun({
                owner,
                repo,
                run_id: artifact.workflow_run.id,
              });
              if (
                run.conclusion !== "success" ||
                run.event !== "workflow_dispatch" ||
                run.path !== ".github/workflows/compile.yml"
              ) {
                continue;
              }
              if (
                !newest ||
                Date.parse(run.created_at) > Date.parse(newest.run.created_at) ||
                (run.created_at === newest.run.created_at && run.id > newest.run.id)
              ) {
                newest = { artifact, run };
              }
            }
            if (!newest) {
              core.setFailed(
                `No successful retained compilation exists for target ${process.env.TARGET_ID}. ` +
                "Run Compile essay candidate successfully first."
              );
              return;
            }
            core.info(
              `Publishing ${process.env.TARGET_ID} from compilation run ${newest.run.id} ` +
              `(${newest.artifact.name}).`
            );
            core.setOutput("run-id", String(newest.run.id));
            core.setOutput("artifact", newest.artifact.name);

      - name: Download retained candidate
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.retained.outputs.artifact }}
          path: candidate
          run-id: ${{ steps.retained.outputs.run-id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate retained candidate against current main
        id: candidate
        env:
          CANDIDATE_RUN_ID: ${{ steps.retained.outputs.run-id }}
        working-directory: infra
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          root = Path("../candidate")
          metadata_path = root / "metadata.json"
          final_tex = root / "build/final.tex"
          outline = root / "source/outline.md"
          bibliography = root / "source/references.bib"
          for required in (metadata_path, final_tex, outline, bibliography):
              if not required.is_file():
                  raise SystemExit(f"candidate is incomplete: missing {required}")

          metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
          required_fields = {
              "schema",
              "censorship_source_sha",
              "requested_source_ref",
              "compiled_prose_sha",
              "backend",
              "model",
              "target",
              "workflow_run_id",
              "workflow_run_url",
              "compiled_at",
              "requested_temperature",
              "requested_seed",
              "effective_temperature",
              "effective_seed",
              "variance_controls_note",
              "openai_sdk_version",
          }
          missing = sorted(required_fields - metadata.keys())
          if missing:
              raise SystemExit("candidate metadata missing: " + ", ".join(missing))
          if metadata["schema"] != "censorship-compiled-candidate/1":
              raise SystemExit("candidate metadata has an unsupported schema")
          if metadata["backend"] != "openai":
              raise SystemExit("candidate backend is not supported for publication")
          if metadata["target"] != os.environ["TARGET_ID"]:
              raise SystemExit("candidate target does not match the academic publication target")
          if str(metadata["workflow_run_id"]) != os.environ["CANDIDATE_RUN_ID"]:
              raise SystemExit("candidate run metadata does not match the retained workflow run")
          for key in ("censorship_source_sha", "compiled_prose_sha"):
              if not re.fullmatch(r"[0-9a-f]{40}", str(metadata[key])):
                  raise SystemExit(f"candidate {key} is not a full Git SHA")
          if metadata["requested_source_ref"] != "main":
              raise SystemExit("publication requires a candidate compiled from source_ref=main")
          for candidate_path, current_path in (
              (outline, Path("outline.md")),
              (bibliography, Path("references.bib")),
          ):
              if candidate_path.read_bytes() != current_path.read_bytes():
                  raise SystemExit(
                      f"publication candidate {candidate_path.name} does not match current main"
                  )

          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              for key, value in {
                  "source_sha": metadata["censorship_source_sha"],
                  "compiler_sha": metadata["compiled_prose_sha"],
                  "model": metadata["model"],
                  "compile_run_id": str(metadata["workflow_run_id"]),
                  "compile_run_url": metadata["workflow_run_url"],
                  "compiled_at": metadata["compiled_at"],
                  "requested_temperature": metadata["requested_temperature"],
                  "requested_seed": metadata["requested_seed"],
                  "effective_temperature": "none" if metadata["effective_temperature"] is None else metadata["effective_temperature"],
                  "effective_seed": "none" if metadata["effective_seed"] is None else metadata["effective_seed"],
                  "variance_note": metadata["variance_controls_note"],
                  "openai_sdk_version": metadata["openai_sdk_version"],
              }.items():
                  print(f"{key}={value}", file=handle)
          PY

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc
          pandoc --version

      - name: Render paper and record provenance
        env:
          SOURCE_SHA: ${{ steps.candidate.outputs.source_sha }}
          COMPILED_PROSE_SHA: ${{ steps.candidate.outputs.compiler_sha }}
          WORKFLOW_RUN_URL: ${{ steps.candidate.outputs.compile_run_url }}
          BUILD_TIMESTAMP: ${{ steps.candidate.outputs.compiled_at }}
          OPENAI_MODEL: ${{ steps.candidate.outputs.model }}
          OPENAI_TEMPERATURE: ${{ steps.candidate.outputs.requested_temperature }}
          OPENAI_SEED: ${{ steps.candidate.outputs.requested_seed }}
          EFFECTIVE_TEMPERATURE: ${{ steps.candidate.outputs.effective_temperature }}
          EFFECTIVE_SEED: ${{ steps.candidate.outputs.effective_seed }}
          VARIANCE_NOTE: ${{ steps.candidate.outputs.variance_note }}
          OPENAI_SDK_VERSION: ${{ steps.candidate.outputs.openai_sdk_version }}
          COMPILE_RUN_ID: ${{ steps.candidate.outputs.compile_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          pandoc_version=$(pandoc --version | head -n1)
          infra/publication/render.sh \
            candidate/build/final.tex \
            candidate/source/references.bib \
            publication-build
          python infra/publication/site.py provenance \
            --output publication-build/provenance.json \
            --source-sha "$SOURCE_SHA" \
            --compiler-sha "$COMPILED_PROSE_SHA" \
            --backend openai \
            --model "$OPENAI_MODEL" \
            --target "$TARGET_ID" \
            --run-id "$COMPILE_RUN_ID" \
            --run-url "$WORKFLOW_RUN_URL" \
            --timestamp "$BUILD_TIMESTAMP" \
            --requested-temperature "$OPENAI_TEMPERATURE" \
            --requested-seed "$OPENAI_SEED" \
            --effective-temperature "$EFFECTIVE_TEMPERATURE" \
            --effective-seed "$EFFECTIVE_SEED" \
            --variance-note "$VARIANCE_NOTE" \
            --pandoc-version "$pandoc_version" \
            --openai-sdk-version "$OPENAI_SDK_VERSION"

      - name: Upload rendered publication candidate
        uses: actions/upload-artifact@v4
        with:
          name: censorship-publication-${{ github.run_id }}
          path: publication-build/
          if-no-files-found: error
          retention-days: 90

  release-approval:
    needs: assemble
    runs-on: ubuntu-latest
    environment: publication-release
    steps:
      - run: echo "Paper publication approved."

  publish:
    needs:
      - assemble
      - release-approval
    if: >-
      always() &&
      needs.assemble.result == 'success' &&
      needs.release-approval.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out trusted publication updater
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: infra
          persist-credentials: false

      - name: Check out repository for gh-pages update
        uses: actions/checkout@v7
        with:
          ref: main
          path: site-repo
          fetch-depth: 0

      - name: Prepare publication branch
        shell: bash
        working-directory: site-repo
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin refs/heads/gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git switch --force-create gh-pages origin/gh-pages
          else
            git switch --orphan gh-pages
            git rm -rf --ignore-unmatch .
          fi

      - name: Download rendered publication candidate
        uses: actions/download-artifact@v4
        with:
          name: censorship-publication-${{ github.run_id }}
          path: publication-build

      - name: Replace published paper
        run: |
          python infra/publication/site.py update \
            --site-root site-repo/docs \
            --build-dir publication-build

      - name: Commit publication transactionally
        shell: bash
        working-directory: site-repo
        env:
          SOURCE_SHA: ${{ needs.assemble.outputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Validated source SHA was not propagated to the publish job."
            exit 20
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- docs
          if git diff --cached --quiet; then
            echo "Publication content is unchanged; nothing to push." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "Publish paper from $SOURCE_SHA"
          git push origin HEAD:gh-pages
          {
            echo "## Published paper"
            echo
            echo "Target: journal_academic"
            echo "The site root now contains this publication."
          } >> "$GITHUB_STEP_SUMMARY"
