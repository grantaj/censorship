name: Compile essay candidate

# Spending invariant: this is the only censorship workflow allowed to reference
# OPENAI_API_KEY, and it must never gain an automatic trigger.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Censorship branch, tag, or SHA to compile
        required: true
        default: main
        type: string
      openai_model:
        description: OpenAI model
        required: true
        type: choice
        default: gpt-5-mini
        options:
          - gpt-5-mini
          - gpt-5
          - gpt-5.6-luna
          - gpt-5.6-terra
          - gpt-5.6-sol
      target:
        description: Compilation target
        required: true
        type: choice
        default: journal_academic
        options:
          - journal_academic
          - magazine_general
          - explain_like_im_5
      confirm_paid_run:
        description: I approve this paid compiled-prose run
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: censorship-compile
  cancel-in-progress: false

env:
  OPENAI_TEMPERATURE: "0.2"
  OPENAI_SEED: "42"
  OPENAI_MAX_OUTPUT_TOKENS: "10000"

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce explicit paid-run and trusted-workflow gates
        shell: bash
        env:
          WORKFLOW_REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          CONFIRM_PAID_RUN: ${{ inputs.confirm_paid_run }}
        run: |
          set -euo pipefail
          if [[ "$WORKFLOW_REF" != "refs/heads/main" ]]; then
            echo "::error::Run this workflow from main so compilation code is trusted."
            exit 2
          fi
          if [[ "$ACTOR" != "$REPOSITORY_OWNER" ]]; then
            echo "::error::Only the repository owner may authorize a paid compilation."
            exit 3
          fi
          if [[ "$CONFIRM_PAID_RUN" != "true" ]]; then
            echo "::error::Paid compilation was not explicitly approved. No provider call will be made."
            exit 4
          fi

  compile:
    needs: guard
    runs-on: ubuntu-latest
    environment: paid-compile
    permissions:
      contents: read
    env:
      OPENAI_MODEL: ${{ inputs.openai_model }}
      TARGET_ID: ${{ inputs.target }}
    steps:
      - name: Check out trusted candidate infrastructure
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: infra
          persist-credentials: false

      - name: Check out selected conceptual source as data only
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          path: source-input
          persist-credentials: false
          sparse-checkout: |
            outline.md
            references.bib
          sparse-checkout-cone-mode: false

      # Intentionally follow compiled-prose main while the compiler is under active development.
      # The resolved compiler commit is retained in candidate metadata for provenance.
      - name: Check out compiled-prose main
        uses: actions/checkout@v7
        with:
          repository: grantaj/compiled-prose
          ref: main
          path: compiler
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Resolve and validate exact inputs
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          source_sha=$(git -C source-input rev-parse HEAD)
          compiler_sha=$(git -C compiler rev-parse HEAD)
          for source_file in outline.md references.bib; do
            mode_type=$(git -C source-input ls-tree "$source_sha" -- "$source_file" | awk '{print $1 " " $2}')
            if [[ "$mode_type" != "100644 blob" && "$mode_type" != "100755 blob" ]]; then
              echo "::error::Selected source $source_file must be a regular Git blob, not a symlink or special entry."
              exit 11
            fi
            if [[ -L "source-input/$source_file" ]]; then
              echo "::error::Selected source $source_file resolved to a symlink."
              exit 11
            fi
          done
          if [[ ! -s source-input/outline.md ]]; then
            echo "::error::Selected source ref has no non-empty outline.md."
            exit 12
          fi
          if [[ ! -f source-input/references.bib ]]; then
            echo "::error::Selected source ref has no references.bib."
            exit 13
          fi
          case "$OPENAI_MODEL" in
            gpt-5-mini|gpt-5|gpt-5.6-luna|gpt-5.6-terra|gpt-5.6-sol) ;;
            *) echo "::error::Unsupported OpenAI model: $OPENAI_MODEL"; exit 14 ;;
          esac
          case "$TARGET_ID" in
            journal_academic|magazine_general|explain_like_im_5) ;;
            *) echo "::error::Unsupported compilation target: $TARGET_ID"; exit 15 ;;
          esac
          target_style="prompts/targets/$TARGET_ID.md"
          if [[ ! -f "compiler/$target_style" ]]; then
            echo "::error::Compiler lacks target $target_style."
            exit 16
          fi
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "compiler_sha=$compiler_sha" >> "$GITHUB_OUTPUT"
          echo "target_style=$target_style" >> "$GITHUB_OUTPUT"

      - name: Verify API credential is configured
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo "::error::OPENAI_API_KEY is not configured; no provider call was made."
            exit 20
          fi

      - name: Install compiler and LaTeX validation dependencies
        run: |
          python -m pip install --disable-pip-version-check -r compiler/requirements.txt
          sudo apt-get update
          sudo apt-get install --yes latexmk texlive-latex-extra texlive-bibtex-extra biber cm-super
          latexmk -v
          biber --version

      - name: Compile and validate full prose pipeline
        id: compile
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TARGET_STYLE: ${{ steps.inputs.outputs.target_style }}
        shell: bash
        run: |
          set -euo pipefail
          make -C compiler clobber
          mkdir -p compiler/build
          cp source-input/references.bib compiler/build/references.bib
          make -C compiler \
            BACKEND=openai \
            IN="$GITHUB_WORKSPACE/source-input/outline.md" \
            BIBLIOGRAPHY="$GITHUB_WORKSPACE/compiler/build/references.bib" \
            TARGET_STYLE="$TARGET_STYLE" \
            OPENAI_MODEL="$OPENAI_MODEL" \
            OPENAI_TEMPERATURE="$OPENAI_TEMPERATURE" \
            OPENAI_SEED="$OPENAI_SEED" \
            OPENAI_MAX_OUTPUT_TOKENS="$OPENAI_MAX_OUTPUT_TOKENS" \
            VALIDATE_LATEX_STAGES=1 \
            final
          make -C compiler validate-latex

      - name: Summarize OpenAI usage
        if: always()
        shell: bash
        run: |
          if [[ -f compiler/build/openai-usage.jsonl ]]; then
            python compiler/tools/summarize_openai_usage.py \
              --input compiler/build/openai-usage.jsonl | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Summarize compiler failure
        if: steps.compile.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "## compiled-prose failed"
            echo
            echo "No publication state was modified."
            echo
            for diagnostic in compiler/build/errors/*.md; do
              [[ -e "$diagnostic" ]] || continue
              echo "### $(basename "$diagnostic")"
              cat "$diagnostic"
              echo
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload failed compilation evidence
        if: steps.compile.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: censorship-failure-${{ inputs.target }}-${{ inputs.openai_model }}-${{ github.run_id }}
          path: |
            compiler/build/
            source-input/outline.md
            source-input/references.bib
          if-no-files-found: warn
          retention-days: 90

      - name: Stop after compiler failure
        if: steps.compile.outcome == 'failure'
        run: exit 1

      - name: Assemble retained candidate
        env:
          SOURCE_SHA: ${{ steps.inputs.outputs.source_sha }}
          COMPILER_SHA: ${{ steps.inputs.outputs.compiler_sha }}
          SOURCE_REF: ${{ inputs.source_ref }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate/build candidate/source
          cp -a compiler/build/. candidate/build/
          cp source-input/outline.md source-input/references.bib candidate/source/
          export COMPILED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export OPENAI_SDK_VERSION="$(python -c 'import openai; print(openai.__version__)')"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = {
              "schema": "censorship-compiled-candidate/1",
              "censorship_source_sha": os.environ["SOURCE_SHA"],
              "requested_source_ref": os.environ["SOURCE_REF"],
              "compiled_prose_sha": os.environ["COMPILER_SHA"],
              "backend": "openai",
              "model": os.environ["OPENAI_MODEL"],
              "target": os.environ["TARGET_ID"],
              "workflow_run_id": os.environ["RUN_ID"],
              "workflow_run_url": os.environ["RUN_URL"],
              "compiled_at": os.environ["COMPILED_AT"],
              "requested_temperature": os.environ["OPENAI_TEMPERATURE"],
              "requested_seed": os.environ["OPENAI_SEED"],
              "effective_temperature": None,
              "effective_seed": None,
              "variance_controls_note": (
                  "compiled-prose omits temperature for gpt-5-family models and "
                  "the OpenAI Responses API does not accept seed"
              ),
              "openai_sdk_version": os.environ["OPENAI_SDK_VERSION"],
          }
          Path("candidate/metadata.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload retained candidate
        uses: actions/upload-artifact@v4
        with:
          name: censorship-candidate-${{ inputs.target }}-${{ inputs.openai_model }}-${{ github.run_id }}
          path: candidate/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
